name: Scrape Machine Data

on:
  schedule:
    - cron: '0 2 * * 0'  # Jeden Sonntag 02:00 UTC (03:00 CET)
  workflow_dispatch:      # Manuell triggern über GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DMG MORI scraper
        env:
          WP_REST_URL: ${{ secrets.WP_REST_URL }}
          WP_WEBHOOK_TOKEN: ${{ secrets.WP_WEBHOOK_TOKEN }}
        run: python scrapers/dmg_mori.py

      - name: Run HAAS scraper
        env:
          WP_REST_URL: ${{ secrets.WP_REST_URL }}
          WP_WEBHOOK_TOKEN: ${{ secrets.WP_WEBHOOK_TOKEN }}
        run: python scrapers/haas.py

      - name: Run GROB scraper
        env:
          WP_REST_URL: ${{ secrets.WP_REST_URL }}
          WP_WEBHOOK_TOKEN: ${{ secrets.WP_WEBHOOK_TOKEN }}
        run: python scrapers/grob.py

      - name: Update scraper status
        env:
          WP_REST_URL: ${{ secrets.WP_REST_URL }}
          WP_WEBHOOK_TOKEN: ${{ secrets.WP_WEBHOOK_TOKEN }}
        run: python -c "from scrapers.base_scraper import upload_scraper_status; upload_scraper_status()"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('❌ Scraper run failed');
            console.log('Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');
